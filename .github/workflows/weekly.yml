name: Weekly Flare Detection

on:
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/LatioAstro/AutomationDetection".insteadOf "https://github.com/LatioAstro/AutomationDetection"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          git config --global --unset url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/LatioAstro/AutomationDetection".insteadOf || true

      - name: Run script
        run: python AutomatedScript.py