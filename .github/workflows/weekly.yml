name: Automated Detection Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "59 23 * * 6"

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:

      ###############################################################
      # Analysis repo
      ###############################################################

      - name: Checkout AutomationDetection
        uses: actions/checkout@v4
        with:
          lfs: true

      ###############################################################
      # Python
      ###############################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ###############################################################
      # Install packages
      ###############################################################

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      ###############################################################
      # Recreate weekly_email.env
      ###############################################################

      - name: Create weekly_email.env
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          contents = "\n".join([
              "SMTP_HOST=smtp.gmail.com",
              "SMTP_PORT=587",
              f"SMTP_USER={os.environ['SMTP_USER']}",
              f"SMTP_PASSWORD={os.environ['SMTP_PASSWORD']}",
              "",
              f"ALERT_EMAIL_FROM={os.environ['SMTP_USER']}",
              f"ALERT_EMAIL_TO={os.environ['ALERT_EMAIL_TO']}",
              "EMAIL_SUBJECT_PREFIX=AutomationDetection weekly flare alert",
              "",
              "FLARE_THRESHOLD_MULTIPLIER=1.0",
              "CONSECUTIVE_POINTS=3",
              "INCREMENTAL_PERCENT=0.3",
              "LIGHTCURVE_CADENCE=weekly",
              "LOOKBACK_WEEKS=10.0",
              "DETECTION_METHOD=sigma",
              "CONFIRMED_SIGMA_THRESHOLD=3.0",
              "",
              "COSI_BACKGROUND_RATE=0.25",
              "MDP99_AVERAGE_MU=0.3",
              "",
              "SOURCE_NAME=",
              "EMAIL_FORCE_SEND=1",
          ])

          Path("weekly_email.env").write_text(contents + "\n", encoding="utf-8")
          PY

      ###############################################################
      # Run analysis
      ###############################################################

      - name: Run detection
        run: |
          chmod +x run_weekly_email_cron.sh

          bash run_weekly_email_cron.sh weekly_email.env

      ###############################################################
      # Website repo
      ###############################################################

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: LatioAstro/autodetectwebsite
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: website

      ###############################################################
      # Copy JSON
      ###############################################################

      - name: Copy JSON files
        run: |
          mkdir -p website/data/src_data
          rsync -av --delete Sources/ website/data/src_data/

      ###############################################################
      # Commit
      ###############################################################

      - name: Push website updates
        run: |
          cd website

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/src_data

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Automatic source update"
            git push
          fi